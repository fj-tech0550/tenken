    .mlist{border:1.5px solid var(--ic-border);border-radius:12px;max-height:38vh;overflow-y:auto}

    .mhead button{border:1px solid var(--ic-border);background:var(--ic-card);color:var(--ic-primary);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
    .inherit input{width:22px;height:22px;margin-top:1px;accent-color:#137333;flex-shrink:0}

    .spin{width:52px;height:52px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:12px 22px;border-radius:30px;font-size:16px;font-weight:700;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:92vw;text-align:center;color:#fff;background:#202124}
    .toast{pointer-events:none}

<body>
<div class="ic-root app" id="app"></div>
<div class="ic-root" id="layer"></div>

<script>
'use strict';
const C = window.InspCore;
C.injectCSS();

// =====================================================
// 写真（添付ファイル／添付ファイル_0／添付ファイル_1）
//   撮影・選択した写真はスマホ側で長い辺1600pxに縮小してから GAS 経由で kintone にアップロード
//   アップロードで得た fileKey を、保存時に添付ファイルフィールドへ指定して添付する
// =====================================================
C.PHOTO_ENABLED = true;
const THUMB = {};   // fileKey → 表示用の画像（dataURL）
function b64ToBlob(b64, type) {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: type || 'image/jpeg' });
}
C.photoHooks = {
  async upload(file) {
    const src = await C.resizeImage(file, 1600, 0.8), b64 = src.split(',')[1];
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const name = `photo_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.jpg`;
    const res = await callGAS('uploadFile', { name, contentType: 'image/jpeg', data: b64 }, true);
    THUMB[res.fileKey] = src;
    return { fileKey: res.fileKey, name, contentType: 'image/jpeg', size: Math.round(b64.length * 0.75), _src: src };
  },
  async thumb(fileKey) {
    if (THUMB[fileKey]) return THUMB[fileKey];
    const r = await callGAS('getFile', { fileKey });
    const src = await C.resizeImage(b64ToBlob(r.data, r.contentType), 600, 0.8);
    THUMB[fileKey] = src;
    return src;
  },
  error(msg) { toast(msg, 'error'); }
};
// 保存後は kintone が別の fileKey を返すので、表示用の画像を引き継ぐ
function carryThumbs(from, to) {
  C.PHOTO_FIELDS.forEach(f => {
    const a = (from.files && from.files[f]) || [], b = (to.files && to.files[f]) || [];
    if (a.length === b.length) a.forEach((x, i) => { const src = x._src || THUMB[x.fileKey]; if (src && b[i].fileKey) THUMB[b[i].fileKey] = src; });
  });
  return to;
}
const isUploading = m => C.PHOTO_FIELDS.some(f => ((m.files && m.files[f]) || []).some(x => x.uploading));

// =====================================================
// ★ GAS エンドポイントURL（GASを「新しいデプロイ」した場合はここを差し替え）
// =====================================================
const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxY9uV845y4Ul_OJb3uPdNlk2BF7M_x7Fq3eVFYVjts3E_kTihk6wsMI5GJE-gF6dMRig/exec';

// 読込：GET ／ 書込：POST（text/plain にすると CORS のプリフライトが発生せず GAS に届く）
// 室内機の行が多いとURLが長くなり GET では送れないため、書込は POST を使う
async function callGAS(action, data = {}, write = false) {
  if (write) {
    try {
      const res = await fetch(GAS_ENDPOINT, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, data })
      });
      return await parseRes(res);
    } catch (err) {
      // 通信自体の失敗のときだけ、何度送っても結果が同じ更新処理に限って GET で再送
      if (!(err instanceof TypeError) || action !== 'updateRecord') throw err;
    }
  }
  const url = new URL(GAS_ENDPOINT);
  url.searchParams.set('action', action);
  if (Object.keys(data).length) url.searchParams.set('data', JSON.stringify(data));
  if (url.toString().length > 7500) throw new Error('送信データが大きすぎます');
  return parseRes(await fetch(url.toString(), { redirect: 'follow' }));
}
async function parseRes(res) {
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = JSON.parse(await res.text());
  if (j.conflict) return j;   // 同時編集：呼び出し側でマージ
  if (j.success === false) throw new Error(j.error || '処理に失敗しました');
  return j;
}

// =====================================================
// 状態
// =====================================================
const S = {
  screen: 'groups',   // groups | group | input
  groups: null, gErr: '', localGroups: [], q: '',
  group: null, machines: null, mErr: '', filter: 'all', mi: -1,
  sheet: null
};
const AD = { addr: '', tel: '', step: 'edit' };   // 住所・連絡先シート
const ng = { date: '', site: '', type: C.INSPECT_TYPES[0], name: '', edited: false, inherit: true, src: '', sel: null };
const NG_SRC = { cache: {}, loading: '' };   // 引き継ぎ元グループのレコード（グループ名ごとに保持）
const $app = document.getElementById('app'), $layer = document.getElementById('layer');
const esc = C.esc;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const slash = d => (d || '').replace(/-/g, '/');
const cur = () => (S.machines && S.machines[S.mi]) || null;

function toMachine(rec) {
  const m = C.fromRecord(rec);
  m.id = rec['$id'].value;
  if (m.v.冷媒種) C.updateSat(m);
  m.dirty = false;
  m.rev = rec['$revision'] ? rec['$revision'].value : null;
  m.base = snap(m);   // 開いた時点の内容（変更点の判定・同時編集のマージに使う）
  // 報告書に載せる住所・電話番号（入力画面では扱わず、グループ画面から一括で入れる）
  m.addr = (rec['報告書へ記載する住所'] && rec['報告書へ記載する住所'].value) || '';
  m.tel  = (rec['報告書へ記載する電話番号'] && rec['報告書へ記載する電話番号'].value) || '';
  return m;
}
const addrKey = x => (x.addr || '') + '\u0001' + (x.tel || '');
const hasAddr = x => !!((x.addr || '').trim() || (x.tel || '').trim());
// グループ内の住所の入力状況：values=入力済みの住所の種類（台数の多い順）, empty=未入力の台数
function addrStat() {
  const map = new Map(); let empty = 0;
  (S.machines || []).forEach(m => {
    if (!hasAddr(m)) { empty++; return; }
    const k = addrKey(m); if (!map.has(k)) map.set(k, { addr: m.addr, tel: m.tel, count: 0 }); map.get(k).count++;
  });
  return { values: [...map.values()].sort((a, b) => b.count - a.count), empty, total: (S.machines || []).length };
}
function addrRecord(addr, tel) {
  return { 報告書へ記載する住所: { value: addr }, 報告書へ記載する電話番号: { value: tel } };
}
function groupFields(g) {
  return { 点検グループ: { value: g.name }, 日付: { value: g.date }, 現場名: { value: g.site }, 点検種類: { value: g.type } };
}
// =====================================================
// 同時編集対策
//   ② 保存するのは「開いた時点から自分が変えた項目」だけ
//   ③ 他の人が先に保存していたら（リビジョン不一致）、項目ごと・室内機の行ごとに自動でまとめる。
//      同じ項目を2人が違う値に変えていたときだけ、どちらを残すか聞く
// =====================================================
const J = x => JSON.stringify(x);
const IUT = C.IU.table;
const DERIVED = new Set(['入力進捗', '高圧飽和温度', '低圧飽和温度']);   // 他の値から計算する項目（比較しない）
function snap(m) { return JSON.parse(J(C.toRecord(m, { files: true }))); }

function buildPayload(m, base) {
  const cur = snap(m), r = {};
  Object.keys(cur).forEach(k => { if (!DERIVED.has(k) && J(cur[k]) !== J(base[k])) r[k] = cur[k]; });
  if (!Object.keys(r).length) return null;                 // 実際の変更なし
  DERIVED.forEach(k => { r[k] = cur[k]; });
  if (Array.isArray(C.rules) && C.rules.length) {           // ルール取得済みのときだけ診断結果を書き込む
    const d = C.diagnose(m), msg = d.cls === 'alert' ? d.msg : '';
    r['自動診断2'] = { value: msg };
    r['報告書用フィールド'] = { value: C.reportText(m, msg) };
  }
  return r;
}

const IU_LBL = { 室内機型式: '型式', 室内機製造番号: '製造番号', 吸込温度: '吸込温度', 吹出温度: '吹出温度', 室内機備考: '備考' };
function fieldLabel(k) {
  if (C.PHOTO_FIELDS.includes(k)) return '写真' + (C.PHOTO_FIELDS.indexOf(k) + 1);
  const vis = C.VISUAL.find(x => x[0] === k || x[1] === k);
  if (vis) return vis[0] === k ? vis[2] : vis[2] + 'の備考';
  return C.LBL[k] || { 対象外項目: '対象外の設定', 報告書へ掲載する情報: '報告書掲載', 備考: '備考' }[k] || k;
}
const showVal = v => Array.isArray(v) ? (v.length && typeof v[0] === 'object' ? (v.length + '枚') : (v.join('・') || '（なし）')) : (v === '' || v == null ? '（空欄）' : String(v));
const rowName = r => [r.value.室内機型式 && r.value.室内機型式.value, r.value.室内機製造番号 && r.value.室内機製造番号.value].filter(Boolean).join(' ') || '行';

// base=開いた時点, mine=自分の入力, theirs=他の人が保存した最新 → policy別の結果と衝突一覧
function mergeRecords(base, mine, theirs) {
  const outM = JSON.parse(J(theirs)), outT = JSON.parse(J(theirs)), conflicts = [];
  Object.keys(mine).forEach(k => {
    if (DERIVED.has(k) || k === IUT) return;
    if (J(mine[k]) === J(base[k])) return;                                   // 自分は変えていない
    if (J(theirs[k]) === J(base[k]) || J(mine[k]) === J(theirs[k])) { outM[k] = outT[k] = mine[k]; return; }
    outM[k] = mine[k];
    conflicts.push({ label: fieldLabel(k), mine: showVal(mine[k].value), theirs: showVal(theirs[k].value) });
  });
  // 室内機：行IDで突き合わせる
  const map = rec => { const o = {}; (rec[IUT].value || []).forEach(r => { if (r.id) o[r.id] = r; }); return o; };
  const bR = map(base), mR = map(mine), tR = map(theirs), rowsM = [], rowsT = [];
  theirs[IUT].value.forEach(tr => {
    const b = bR[tr.id], mm = mR[tr.id];
    if (!b) { rowsM.push(tr); rowsT.push(tr); return; }                     // 相手が追加した行
    if (!mm) {                                                               // 自分が削除した行
      if (J(tr.value) === J(b.value)) return;
      conflicts.push({ label: `室内機（${rowName(tr)}）`, mine: '削除', theirs: '内容を変更' });
      rowsT.push(tr); return;
    }
    const rm = JSON.parse(J(tr)), rt = JSON.parse(J(tr));
    Object.keys(mm.value).forEach(c => {
      if (J(mm.value[c]) === J(b.value[c])) return;
      if (J(tr.value[c]) === J(b.value[c]) || J(mm.value[c]) === J(tr.value[c])) { rm.value[c] = rt.value[c] = mm.value[c]; return; }
      rm.value[c] = mm.value[c];
      conflicts.push({ label: `室内機（${rowName(tr)}）${IU_LBL[c] || c}`, mine: showVal(mm.value[c].value), theirs: showVal(tr.value[c].value) });
    });
    rowsM.push(rm); rowsT.push(rt);
  });
  Object.keys(bR).forEach(id => {                                            // 相手が削除した行
    if (tR[id] || !mR[id] || J(mR[id].value) === J(bR[id].value)) return;
    conflicts.push({ label: `室内機（${rowName(mR[id])}）`, mine: '内容を変更', theirs: '削除' });
    rowsM.push({ value: mR[id].value });                                     // 残す場合は新しい行として追加
  });
  mine[IUT].value.filter(r => !r.id).forEach(r => { rowsM.push(r); rowsT.push(r); });   // 自分が追加した行
  outM[IUT] = { value: rowsM }; outT[IUT] = { value: rowsT };
  return { mine: outM, theirs: outT, conflicts };
}

// 衝突確認シート（resolve: 'mine' | 'theirs' | 'cancel'）
let conflictResolve = null, conflictList = [];
function askConflict(list) {
  conflictList = list; S.sheet = 'conflict'; renderSheet();
  const t = document.getElementById('toast'); if (t) t.hidden = true;
  return new Promise(res => { conflictResolve = v => { conflictResolve = null; S.sheet = null; renderSheet(); res(v); }; });
}

function ngCurName() { return ng.edited ? ng.name : ngName(); }
function syncSrc() {   // 現場名などが変わったら引き継ぎ元を選び直す
  const cands = ng.site.trim() ? candidatesOf(ng.site, ngCurName()) : [];
  if (!cands.find(c => c.name === ng.src)) { ng.src = cands[0] ? cands[0].name : ''; ng.sel = null; }
  if (ng.inherit && ng.src && NG_SRC.cache[ng.src] === undefined) loadSrc(ng.src);
  else { if (ng.src && NG_SRC.cache[ng.src] && !ng.sel) ng.sel = new Set(NG_SRC.cache[ng.src].map(r => r['$id'].value)); renderInherit(); }

async function loadSrc(name) {
  ng.src = name; ng.sel = null;
  if (NG_SRC.cache[name]) { ng.sel = new Set(NG_SRC.cache[name].map(r => r['$id'].value)); renderInherit(); return; }
  NG_SRC.loading = name; renderInherit();
  try { NG_SRC.cache[name] = (await callGAS('getGroupRecords', { group: name })).records || []; }
  catch (e) { delete NG_SRC.cache[name]; toast('引き継ぎ元の機器を読み込めませんでした：' + e.message, 'error'); }
  if (NG_SRC.loading === name) NG_SRC.loading = '';
  if (ng.src === name && NG_SRC.cache[name]) ng.sel = new Set(NG_SRC.cache[name].map(r => r['$id'].value));   // 初期は全台選択
  renderInherit();
}

// ── オーバーレイ・トースト ──
function overlay(msg) {
  let o = document.getElementById('overlay');
  if (!msg) { if (o) o.remove(); return; }
  if (!o) { o = document.createElement('div'); o.id = 'overlay'; o.className = 'overlay'; document.body.appendChild(o); }
  o.innerHTML = `<div class="spin"></div><div>${esc(msg)}</div>`;
}
let toastTimer;
function toast(msg, type = '') {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast ' + type; t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3000);
}

  saving = true; overlay('kintone に保存中...');
  try {
    let model = m, base = m.base, rev = m.rev, merged = false, latestRec = null;
    for (let tries = 0; tries < 4; tries++) {
      const payload = buildPayload(model, base);
      if (!payload) {                                   // 送る変更が無い（相手の入力を残した場合など）
        S.machines[S.mi] = latestRec ? toMachine(latestRec) : Object.assign(m, { dirty: false });
        if (!silent && merged) toast('相手の入力を残しました');
        return true;
      }
      const res = await callGAS('updateRecord', { id: m.id, record: payload, revision: rev }, true);
      if (!res.conflict) {
        S.machines[S.mi] = carryThumbs(model, toMachine(res.record));
        if (merged) toast('✅ 他の人の入力とまとめて保存しました', 'success');
        else if (!silent) toast('✅ 保存しました', 'success');
        return true;
      }
      // 他の人が先に保存していた → 最新とマージ
      latestRec = res.record;
      const latest = toMachine(res.record);
      const mg = mergeRecords(base, snap(model), latest.base);
      let policy = 'mine';
      if (mg.conflicts.length) {
        overlay('');
        policy = await askConflict(mg.conflicts);
        if (policy === 'cancel') { toast('保存していません。内容を確認して、もう一度保存してください'); return false; }
        overlay('kintone に保存中...');
      }
      const nm = C.fromRecord(policy === 'mine' ? mg.mine : mg.theirs);
      if (nm.v.冷媒種) C.updateSat(nm);
      model = nm; base = latest.base; rev = latest.rev; merged = (J(latest.base) !== J(m.base)) || merged;
      // 画面の内容もマージ結果に合わせる
      Object.assign(m, { v: nm.v, indoor: nm.indoor, na: nm.na, files: nm.files });
    }
    throw new Error('同時に保存が続いたため保存できませんでした。もう一度保存してください');
  } catch (e) {
    toast('❌ 保存できませんでした：' + e.message, 'error');
    return false;
  } finally { saving = false; overlay(''); }
}
async function openMachine(i) {
  overlay('最新の内容を読み込み中...');
  try { S.machines[i] = toMachine((await callGAS('getRecord', { id: S.machines[i].id })).record); }
  catch (e) { toast('最新の内容を読み込めませんでした（前回の内容を表示しています）', 'error'); }
  finally { overlay(''); }
  S.mi = i; S.screen = 'input'; render(); updSaveBtn();
  const sc = $app.querySelector('.ic-scroll'); if (sc) sc.scrollTop = 0;
}
async function refreshMachines() {   // 他の人の進捗を反映（表示は先に出して、裏で読み直す）
  const g = S.group;
  try {
    const recs = (await callGAS('getGroupRecords', { group: g.name })).records || [];
    if (S.group === g && S.screen === 'group') { S.machines = recs.map(toMachine); render(); }
  } catch (e) { /* 表示中の内容のままにする */ }
}
async function createGroup() {
  const site = ng.site.trim(), name = (ng.edited ? ng.name : ngName()).trim();
  if (!site) { toast('現場名を入力してください', 'error'); document.getElementById('ng-site').focus(); return; }
  if (!ng.date) { toast('点検日を入力してください', 'error'); return; }
  if (!name) { toast('グループ名を入力してください', 'error'); return; }
  const g = { name, date: ng.date, site, type: ng.type, total: 0, done: 0, pDone: 0, pTotal: 0 };
  const exist = allGroups().find(x => x.name === name);
  if (exist) { S.sheet = null; toast('同じ名前のグループを開きました'); openGroup(exist); return; }
  // 他の人が直前に同じグループを作っていないか kintone で確認（二重作成の防止）
  overlay('確認中...');
  try {
    const already = (await callGAS('getGroupRecords', { group: name })).records || [];
    if (already.length) { overlay(''); S.sheet = null; toast('他の人が同じグループを作成済みでした。そのグループを開きます'); S.localGroups.push(g); openGroup(g); return; }
  } catch (e) { overlay(''); toast('❌ 確認できませんでした：' + e.message, 'error'); return; }
  overlay('');

  // 引き継ぎ候補があるのに機器一覧をまだ表示していない場合は、先に一覧を出して選んでもらう
  if (ng.inherit && candidatesOf(site, name).length && (!ng.src || NG_SRC.cache[ng.src] === undefined || NG_SRC.loading === ng.src)) {
    clearTimeout(ngTimer); syncSrc(); toast('引き継ぐ機器を確認してから「作成」を押してください'); return;
  }
  const src = selectedSrc();
  if (src.length) {
    overlay(`機器 ${src.length}台を引き継いでいます...`);
    try {
      const recs = src.map(rec => C.inheritRecord(rec, g));   // 機器情報・住所をコピー、測定値は空
      for (let i = 0; i < recs.length; i += 100) await callGAS('saveRecords', { records: recs.slice(i, i + 100) }, true);
      overlay(''); S.sheet = null;
      toast(`✅ 作成しました（機器 ${recs.length}台）`, 'success');
      S.localGroups.push(g); openGroup(g);
    } catch (e) { overlay(''); toast('❌ 作成できませんでした：' + e.message, 'error'); }
    return;
  }
  S.sheet = null; S.localGroups.push(g);
  S.group = g; S.machines = []; S.mErr = ''; S.screen = 'group'; render();
  toast('作成しました。「＋ 機器を追加」から登録してください');
}
async function addMachine() {
  const val = c => document.getElementById('am-' + c).value.trim();
  if (!val('系統')) { toast('系統を入力してください', 'error'); document.getElementById('am-系統').focus(); return; }
  const n = C.emptyModel();
  ['系統','型式','製造番号','冷媒種'].forEach(c => { n.v[c] = val(c); });
  overlay('機器を登録中...');
  try {
    const st = addrStat(), a = st.values.length === 1 ? st.values[0] : { addr: '', tel: '' };
    const res = await callGAS('saveRecord', { record: Object.assign(C.toRecord(n), groupFields(S.group), addrRecord(a.addr, a.tel)) }, true);
    S.machines.push(toMachine(res.record));
    S.mi = S.machines.length - 1; S.sheet = null; S.screen = 'input'; render(); updSaveBtn();
    toast('✅ 登録しました', 'success');
  } catch (e) { toast('❌ 登録できませんでした：' + e.message, 'error'); }
  finally { overlay(''); }
}

async function applyAddr(mode) {
  const ms = S.machines || [];
  let addr = AD.addr.trim(), tel = AD.tel.trim();
  if (mode === 'fill') { const v0 = addrStat().values[0]; addr = v0.addr; tel = v0.tel; }
  const key = addrKey({ addr, tel });
  const targets = ms.filter(m => addrKey(m) !== key && (mode === 'all' || !hasAddr(m)));
  if (!targets.length) { S.sheet = null; renderSheet(); toast('変更はありません'); return; }
  overlay(`${targets.length}台に住所を適用中...`);
  try {
    const recs = targets.map(m => ({ id: m.id, record: addrRecord(addr, tel) }));
    for (let i = 0; i < recs.length; i += 100) await callGAS('updateRecords', { records: recs.slice(i, i + 100) }, true);
    targets.forEach(m => { m.addr = addr; m.tel = tel; });
    S.sheet = null; render();
    toast(`✅ ${targets.length}台に適用しました`, 'success');
  } catch (e) { toast('❌ 適用できませんでした：' + e.message, 'error'); }
  finally { overlay(''); }
}
function startApply() {
  AD.addr = AD.addr.trim(); AD.tel = AD.tel.trim();
  if (!AD.addr && !AD.tel) { toast('住所か電話番号を入力してください', 'error'); return; }
  const key = addrKey(AD);
  const conflict = (S.machines || []).some(m => hasAddr(m) && addrKey(m) !== key);
  if (conflict) { AD.step = 'confirm'; renderSheet(); } else applyAddr('all');
}

// =====================================================
// イベント
// =====================================================
C.bindForm($app, () => (S.screen === 'input' ? cur() : null), 'w', m => { m.dirty = true; updSaveBtn(); });

async function onAct(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a.indexOf('iu-') === 0) return;   // 室内機の操作は bindForm 側で処理
  switch (a) {
    case 'reload':  loadGroups(); break;
    case 'reload-g': openGroup(S.group); break;
    case 'open-g':  { const g = allGroups().find(x => x.name === b.dataset.g); if (g) openGroup(g); break; }
    case 'open-m':  openMachine(+b.dataset.i); break;
    case 'flt':     S.filter = b.dataset.v; render(); break;
    case 'back':
      if (S.screen === 'input') { if (!(await saveCurrent(true))) return; S.screen = 'group'; render(); refreshMachines(); }
      else { S.screen = 'groups'; render(); loadGroups(); }
      break;
    case 'prev': case 'next': {
      if (!(await saveCurrent(true))) return;
      await openMachine(S.mi + (a === 'next' ? 1 : -1));
      toast(`${cur().v.系統 || '次の機器'} を表示中`);
      break;
    }
    case 'save':    if (await saveCurrent(false)) { render(); updSaveBtn(); } break;
    case 'new-g':   Object.assign(ng, { date: today(), site: '', type: C.INSPECT_TYPES[0], name: '', edited: false, inherit: true, src: '', sel: null }); NG_SRC.cache = {}; S.sheet = 'new-g'; renderSheet(); break;
    case 'add-m':   S.sheet = 'add-m'; renderSheet(); break;
    case 'addr':    { const v0 = addrStat().values[0] || { addr: '', tel: '' }; Object.assign(AD, { addr: v0.addr, tel: v0.tel, step: 'edit' }); S.sheet = 'addr'; renderSheet(); break; }
    case 'addr-pick': { const x = addrStat().values[+b.dataset.i]; AD.addr = x.addr; AD.tel = x.tel; renderSheet(); break; }
    case 'addr-apply': startApply(); break;
    case 'addr-back': AD.step = 'edit'; renderSheet(); break;
    case 'addr-do':   applyAddr(b.dataset.mode); break;
    case 'cf':        if (conflictResolve) conflictResolve(b.dataset.v); break;
    case 'close':   if (S.sheet === 'conflict') break; S.sheet = null; renderSheet(); break;
    case 'ng-create': createGroup(); break;
    case 'ng-all':  if (NG_SRC.cache[ng.src]) { ng.sel = new Set(NG_SRC.cache[ng.src].map(r => r['$id'].value)); renderInherit(); } break;
    case 'ng-none': ng.sel = new Set(); renderInherit(); break;
    case 'am-create': addMachine(); break;
  }
}
$app.addEventListener('click', onAct);
$layer.addEventListener('click', onAct);

$app.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value;
  const list = $app.querySelector('.list'), tmp = document.createElement('div');
  tmp.innerHTML = groupsHTML();
  list.innerHTML = tmp.querySelector('.list').innerHTML;
});
let ngTimer;
$layer.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ad-addr') { AD.addr = t.value; return; }
  if (t.id === 'ad-tel')  { AD.tel = t.value; return; }
  if (t.id === 'ng-date') ng.date = t.value;
  if (t.id === 'ng-site') ng.site = t.value;
  if (t.id === 'ng-type') ng.type = t.value;
  if (t.id === 'ng-name') { ng.name = t.value; ng.edited = !!t.value.trim(); }
  if (t.id === 'ng-inh')  { ng.inherit = t.checked; syncSrc(); return; }
  if (t.id === 'ng-src')  { loadSrc(t.value); return; }
  if (t.classList.contains('ng-m')) { if (!ng.sel) ng.sel = new Set(); t.checked ? ng.sel.add(t.dataset.id) : ng.sel.delete(t.dataset.id); updInheritCount(); return; }
  if ((t.id === 'ng-date' || t.id === 'ng-site') && !ng.edited) { const n = document.getElementById('ng-name'); if (n) n.value = ngName(); }
  if (t.id === 'ng-site' || t.id === 'ng-date' || t.id === 'ng-name') { clearTimeout(ngTimer); ngTimer = setTimeout(syncSrc, 300); }
});
window.addEventListener('beforeunload', e => { const m = cur(); if (S.screen === 'input' && m && m.dirty) { e.preventDefault(); e.returnValue = ''; } });

// =====================================================
// 初期化
// =====================================================
render();
loadGroups();
callGAS('getDiagRules')
  .then(d => { C.rules = d.rules || []; })
  .catch(() => { C.rules = []; })
  .finally(() => { const m = cur(); if (m && S.screen === 'input') C.refresh($app, m, 'w'); });
</script>
</body>
</html>
