<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 空調機点検アプリ v2（2026/11/17）：点検グループ → 機器 → 入力 の3画面構成 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="空調点検">
  <link rel="apple-touch-icon" href="icons/aircon/apple-touch-icon.png">
  <link rel="manifest" href="manifest-aircon.webmanifest">
  <meta name="theme-color" content="#1a73e8">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/aircon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/aircon/favicon-192.png">
  <title>空調機点検アプリ</title>
  <!-- 共通モジュール（kintone 側も同じファイルを読み込む） -->
  <script src="inspection-core.js"></script>
  <style>
    html,body{height:100%;margin:0}
    body{background:var(--ic-bg,#f0f4f8)}
    .ic-root.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ic-bg);max-width:720px;margin:0 auto}
    /* ヘッダー */
    .hd{background:var(--ic-primary);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:2}
    .hd .g{flex:1;min-width:0}
    .hd h1{font-size:22px;margin:0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hd .s{font-size:14px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hbtn{border:0;background:rgba(255,255,255,.2);color:#fff;min-width:42px;height:42px;border-radius:21px;font-size:24px;line-height:1;flex-shrink:0;padding:0 12px}
    .hbtn.sm{font-size:15px;font-weight:700}
    /* 一覧 */
    .search{width:100%;height:52px;border:1.5px solid var(--ic-border);border-radius:12px;padding:0 14px;background:var(--ic-card);font-size:18px;color:var(--ic-text);-webkit-appearance:none;appearance:none}
    .lbl{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--ic-sub);margin:16px 4px 8px}
    .list{display:flex;flex-direction:column;gap:10px}
    .card{background:var(--ic-card);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.09);border:0;text-align:left;width:100%;display:flex;flex-direction:column;gap:7px;color:var(--ic-text)}
    .card:active,.mrow:active{background:#f8f9fa}
    .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .date{font-size:14px;font-weight:700;background:#e8f0fe;color:#1a56db;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
    .typ{font-size:13px;color:var(--ic-sub);border:1px solid var(--ic-border);padding:1px 7px;border-radius:6px}
    .card .nm{font-size:20px;font-weight:800}
    .r3{display:flex;justify-content:space-between;font-size:15px;color:var(--ic-sub);gap:8px}
    .r3 b{color:var(--ic-text);font-variant-numeric:tabular-nums}
    .bar{height:7px;background:var(--ic-gray-bg);border-radius:99px;overflow:hidden}
    .bar i{display:block;height:100%;background:var(--ic-primary);border-radius:99px}
    .bar i.ok{background:var(--ic-ok)}
    .fab{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border:0;background:var(--ic-primary);color:#fff;border-radius:99px;padding:16px 22px;font-weight:800;box-shadow:0 6px 18px rgba(26,115,232,.4);font-size:17px}
    .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .sum div{background:var(--ic-card);border-radius:12px;padding:8px 10px;box-shadow:0 1px 4px rgba(0,0,0,.09);text-align:center}
    .sum b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
    .sum span{font-size:14px;color:var(--ic-sub)}
    .seg{display:flex;gap:6px;margin:12px 0 10px}
    .seg button{border:1.5px solid var(--ic-border);background:var(--ic-card);color:var(--ic-text);border-radius:99px;padding:7px 14px;font-size:15px;font-weight:700}
    .seg button[aria-pressed="true"]{border-color:var(--ic-primary);color:var(--ic-primary);background:#e8f0fe}
    .mrow{background:var(--ic-card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.09);display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left;color:var(--ic-text)}
    .mrow .mid{flex:1;min-width:0}
    .mrow .mid b{font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mrow .mid span{font-size:14px;color:var(--ic-sub)}
    .mrow .rt{text-align:right;flex-shrink:0}
    .mrow .big{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
    .mrow .big small{font-size:14px;color:var(--ic-sub);font-weight:600}
    .mrow .iu{font-size:13px;color:var(--ic-sub)}
    .st{font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:3px}
    .st.s0{background:var(--ic-gray-bg);color:var(--ic-sub)}.st.s1{background:var(--ic-warn-bg);color:var(--ic-warn)}.st.s2{background:var(--ic-ok-bg);color:var(--ic-ok)}
    .ghost{width:100%;border:1.5px dashed var(--ic-primary);color:var(--ic-primary);background:transparent;border-radius:12px;padding:14px;font-size:17px;font-weight:700;margin-top:12px}
    /* 住所・連絡先カード */
    .addr{width:100%;border:0;text-align:left;background:var(--ic-card);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.09);padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:4px;color:var(--ic-text)}
    .addr .t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ic-sub)}
    .addr .t .go{margin-left:auto;color:var(--ic-primary);font-size:15px}
    .addr .v{font-size:17px;line-height:1.45;word-break:break-all}
    .addr .v.none{color:var(--ic-sub)}
    .tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px}
    .tag.ok{background:var(--ic-ok-bg);color:var(--ic-ok)}.tag.warn{background:var(--ic-warn-bg);color:var(--ic-warn)}.tag.bad{background:var(--ic-bad-bg);color:var(--ic-bad)}
    .note{background:#e8f0fe;border-radius:12px;padding:12px;font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:8px}
    .note.warn{background:var(--ic-warn-bg)}
    .note b{font-weight:800}
    .pick{border:1.5px solid var(--ic-border);background:var(--ic-card);color:var(--ic-text);border-radius:10px;padding:10px 12px;text-align:left;font-size:15px;line-height:1.4}
    .pick small{display:block;color:var(--ic-sub)}
    .ic-btn.sub{background:var(--ic-card);border:1.5px solid var(--ic-primary);color:var(--ic-primary);flex:1}
    .btns{display:flex;flex-direction:column;gap:8px}
    .msg{padding:40px 16px;text-align:center;color:var(--ic-sub);font-size:17px}
    .msg.err{color:var(--ic-bad)}
    .msg button{margin-top:12px}
    .ic-btn.saved{background:var(--ic-ok-bg);color:var(--ic-ok)}
    /* ボトムシート */
    .sheet-bd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:720px;margin:0 auto;background:var(--ic-card);border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto;animation:up .22s ease-out}
    @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
    .grab{width:42px;height:5px;border-radius:9px;background:var(--ic-border);margin:0 auto 2px}
    .sheet h3{margin:0;font-size:20px}
    .sheet label{display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--ic-sub);font-weight:700}
    .sheet .ic-fi{flex:none;width:100%}
    .preview{background:#e8f0fe;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
    .preview span{font-size:13px;color:#1a56db;font-weight:700}
    .preview input{border:0;background:transparent;font-size:18px;font-weight:800;color:var(--ic-text);padding:0;outline:none;width:100%;font-family:inherit}
    .inherit{display:flex !important;flex-direction:row !important;gap:10px;align-items:flex-start;border:1.5px solid var(--ic-ok);background:var(--ic-ok-bg);border-radius:12px;padding:12px;font-size:15px;color:var(--ic-text) !important;font-weight:600 !important}
    .inherit input{width:22px;height:22px;margin-top:1px;accent-color:#137333;flex-shrink:0}
    .inherit small{display:block;color:var(--ic-sub);font-weight:400}
    /* オーバーレイ・トースト */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;gap:16px}
    .spin{width:52px;height:52px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:12px 22px;border-radius:30px;font-size:16px;font-weight:700;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:92vw;text-align:center;color:#fff;background:#202124}
    .toast.success{background:#34a853}.toast.error{background:#ea4335}
    [hidden]{display:none !important}
  </style>
</head>
<body>
<div class="ic-root app" id="app"></div>
<div class="ic-root" id="layer"></div>

<script>
'use strict';
const C = window.InspCore;
C.injectCSS();

// =====================================================
// ★ GAS エンドポイントURL（GASを「新しいデプロイ」した場合はここを差し替え）
// =====================================================
const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxY9uV845y4Ul_OJb3uPdNlk2BF7M_x7Fq3eVFYVjts3E_kTihk6wsMI5GJE-gF6dMRig/exec';

// 読込：GET ／ 書込：POST（text/plain にすると CORS のプリフライトが発生せず GAS に届く）
// 室内機の行が多いとURLが長くなり GET では送れないため、書込は POST を使う
async function callGAS(action, data = {}, write = false) {
  if (write) {
    try {
      const res = await fetch(GAS_ENDPOINT, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, data })
      });
      return await parseRes(res);
    } catch (err) {
      // 通信自体の失敗のときだけ、何度送っても結果が同じ更新処理に限って GET で再送
      if (!(err instanceof TypeError) || action !== 'updateRecord') throw err;
    }
  }
  const url = new URL(GAS_ENDPOINT);
  url.searchParams.set('action', action);
  if (Object.keys(data).length) url.searchParams.set('data', JSON.stringify(data));
  if (url.toString().length > 7500) throw new Error('送信データが大きすぎます');
  return parseRes(await fetch(url.toString(), { redirect: 'follow' }));
}
async function parseRes(res) {
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = JSON.parse(await res.text());
  if (j.success === false) throw new Error(j.error || '処理に失敗しました');
  return j;
}

// =====================================================
// 状態
// =====================================================
const S = {
  screen: 'groups',   // groups | group | input
  groups: null, gErr: '', localGroups: [], q: '',
  group: null, machines: null, mErr: '', filter: 'all', mi: -1,
  sheet: null
};
const AD = { addr: '', tel: '', step: 'edit' };   // 住所・連絡先シート
const ng = { date: '', site: '', type: C.INSPECT_TYPES[0], name: '', edited: false, inherit: true };
const $app = document.getElementById('app'), $layer = document.getElementById('layer');
const esc = C.esc;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const slash = d => (d || '').replace(/-/g, '/');
const cur = () => (S.machines && S.machines[S.mi]) || null;

function toMachine(rec) {
  const m = C.fromRecord(rec);
  m.id = rec['$id'].value;
  if (m.v.冷媒種) C.updateSat(m);
  m.dirty = false;
  // 報告書に載せる住所・電話番号（入力画面では扱わず、グループ画面から一括で入れる）
  m.addr = (rec['報告書へ記載する住所'] && rec['報告書へ記載する住所'].value) || '';
  m.tel  = (rec['報告書へ記載する電話番号'] && rec['報告書へ記載する電話番号'].value) || '';
  return m;
}
const addrKey = x => (x.addr || '') + '\u0001' + (x.tel || '');
const hasAddr = x => !!((x.addr || '').trim() || (x.tel || '').trim());
// グループ内の住所の入力状況：values=入力済みの住所の種類（台数の多い順）, empty=未入力の台数
function addrStat() {
  const map = new Map(); let empty = 0;
  (S.machines || []).forEach(m => {
    if (!hasAddr(m)) { empty++; return; }
    const k = addrKey(m); if (!map.has(k)) map.set(k, { addr: m.addr, tel: m.tel, count: 0 }); map.get(k).count++;
  });
  return { values: [...map.values()].sort((a, b) => b.count - a.count), empty, total: (S.machines || []).length };
}
function addrRecord(addr, tel) {
  return { 報告書へ記載する住所: { value: addr }, 報告書へ記載する電話番号: { value: tel } };
}
function groupFields(g) {
  return { 点検グループ: { value: g.name }, 日付: { value: g.date }, 現場名: { value: g.site }, 点検種類: { value: g.type } };
}
function buildPayload(m) {
  const r = Object.assign(C.toRecord(m), groupFields(S.group));
  if (Array.isArray(C.rules) && C.rules.length) {   // ルール取得済みのときだけ診断結果を書き込む
    const d = C.diagnose(m), msg = d.cls === 'alert' ? d.msg : '';
    r['自動診断2'] = { value: msg };
    r['報告書用フィールド'] = { value: C.reportText(m, msg) };
  }
  return r;
}

// =====================================================
// 画面描画
// =====================================================
function render() {
  if (S.screen === 'groups') $app.innerHTML = groupsHTML();
  if (S.screen === 'group')  $app.innerHTML = groupHTML();
  if (S.screen === 'input')  $app.innerHTML = inputHTML();
  renderSheet();
}

function allGroups() {
  const names = new Set((S.groups || []).map(g => g.name));
  return (S.groups || []).concat(S.localGroups.filter(g => !names.has(g.name)))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}

function groupsHTML() {
  const D = new Date(), wd = ['日','月','火','水','木','金','土'][D.getDay()];
  let body;
  if (S.groups === null && !S.gErr) body = '<div class="msg">読み込み中...</div>';
  else if (S.gErr) body = `<div class="msg err">取得できませんでした<br>${esc(S.gErr)}<br><button class="ic-btn" data-act="reload">再読み込み</button></div>`;
  else {
    const q = S.q.trim();
    const list = allGroups().filter(g => !q || g.name.includes(q));
    body = list.map(g => {
      const pct = Math.round((g.pDone || 0) / Math.max(1, g.pTotal || 0) * 100);
      return `<button class="card" data-act="open-g" data-g="${esc(g.name)}">
        <div class="r1"><span class="date">${slash(g.date)}</span>${g.type ? `<span class="typ">${esc(g.type)}</span>` : ''}</div>
        <div class="nm">${esc(g.site || g.name)}</div>
        <div class="bar"><i class="${g.total && g.done === g.total ? 'ok' : ''}" style="width:${pct}%"></i></div>
        <div class="r3"><span>機器 <b>${g.done || 0}/${g.total || 0}</b> 完了</span><span>全項目 <b>${pct}%</b></span></div></button>`;
    }).join('') || `<div class="msg">${q ? '該当するグループがありません' : '点検グループがありません。右下から作成してください'}</div>`;
  }
  return `<header class="hd"><div class="g"><h1>🌡 空調機点検</h1><div class="s">${D.getFullYear()}年${D.getMonth() + 1}月${D.getDate()}日（${wd}）</div></div>
    <button class="hbtn sm" data-act="reload" aria-label="再読み込み">↻ 更新</button></header>
  <main class="ic-scroll"><input class="search" id="q" type="search" placeholder="現場名・日付で検索（例：新城、2026年08月）" value="${esc(S.q)}">
    <div class="lbl">点検グループ</div><div class="list">${body}</div><div style="height:90px"></div></main>
  <button class="fab" data-act="new-g">＋ 点検グループ作成</button>`;
}

function groupHTML() {
  const g = S.group;
  let body;
  if (S.machines === null && !S.mErr) body = '<div class="msg">読み込み中...</div>';
  else if (S.mErr) body = `<div class="msg err">取得できませんでした<br>${esc(S.mErr)}<br><button class="ic-btn" data-act="reload-g">再読み込み</button></div>`;
  else {
    const ms = S.machines, cnt = [0, 0, 0];
    ms.forEach(m => cnt[C.status(m)]++);
    const rows = ms.map((m, i) => ({ m, i })).filter(x => S.filter === 'all' || C.status(x.m) !== 2).map(({ m, i }) => {
      const p = C.progress(m), s = C.status(m);
      return `<button class="mrow" data-act="open-m" data-i="${i}">${C.ringSVG(m)}
        <div class="mid"><b>${esc(m.v.系統 || '（系統未入力）')}<span class="st s${s}">${C.STATUS_LABEL[s]}</span></b><span>${esc(m.v.型式 || '型式未入力')}${m.v.製造番号 ? ' / ' + esc(m.v.製造番号) : ''}</span></div>
        <div class="rt"><div class="big">${p.done}<small>/${p.total}</small></div><div class="iu">室内機 ${p.iDone}/${p.iTotal}台</div></div></button>`;
    }).join('') || `<div class="msg">${ms.length ? '未完了の機器はありません' : 'まだ機器がありません'}</div>`;
    const st = addrStat(), v0 = st.values[0];
    const tag = !st.total ? '' : st.values.length > 1 ? '<span class="tag bad">複数の住所</span>'
      : !v0 ? '<span class="tag warn">未入力</span>' : st.empty ? `<span class="tag warn">${st.total - st.empty}/${st.total}台に入力</span>` : '<span class="tag ok">全台入力済み</span>';
    const addrCard = `<button class="addr" data-act="addr"><div class="t">📍 報告書の住所・連絡先 ${tag}<span class="go">${v0 ? '変更 ›' : '入力 ›'}</span></div>
      ${v0 ? `<div class="v">${esc(v0.addr || '（住所なし）')}<br>TEL ${esc(v0.tel || '—')}</div>` : '<div class="v none">報告書に載せる住所・電話番号を入力してください</div>'}</button>`;
    body = addrCard + `<div class="sum"><div><b style="color:var(--ic-ok)">${cnt[2]}</b><span>完了</span></div><div><b style="color:var(--ic-warn)">${cnt[1]}</b><span>入力中</span></div><div><b>${cnt[0]}</b><span>未着手</span></div></div>
      <div class="seg"><button data-act="flt" data-v="all" aria-pressed="${S.filter === 'all'}">すべて ${ms.length}</button><button data-act="flt" data-v="todo" aria-pressed="${S.filter === 'todo'}">未完了 ${cnt[0] + cnt[1]}</button></div>
      <div class="list">${rows}</div><button class="ghost" data-act="add-m">＋ 機器を追加</button><div style="height:24px"></div>`;
  }
  return `<header class="hd"><button class="hbtn" data-act="back" aria-label="グループ一覧へ">‹</button>
    <div class="g"><div class="s">${slash(g.date)}点検${g.type ? ' ・ ' + esc(g.type) : ''}</div><h1>${esc(g.site || g.name)}</h1></div></header>
    <main class="ic-scroll">${body}</main>`;
}

function inputHTML() {
  const m = cur(), n = S.machines.length;
  return `<header class="hd"><button class="hbtn" data-act="back" aria-label="機器一覧へ">‹</button>
    <div class="g"><div class="s">${esc(S.group.site)} ・ ${S.mi + 1}/${n}台目</div><h1>${esc(m.v.系統 || '（系統未入力）')}</h1></div><span class="ic-pillslot">${C.pillHTML(m)}</span></header>
    <nav class="ic-chips" aria-label="セクション">${C.chipsHTML(m)}</nav>
    <main class="ic-scroll"><div class="ic-formslot">${C.formHTML(m, 'w')}</div></main>
    <div class="ic-foot"><button class="ic-btn" data-act="prev" ${S.mi === 0 ? 'disabled' : ''}>‹ 前</button>
      <button class="ic-btn pri" id="btn-save" data-act="save">💾 保存</button>
      <button class="ic-btn" data-act="next" ${S.mi === n - 1 ? 'disabled' : ''}>次 ›</button></div>`;
}
function updSaveBtn() {
  const b = document.getElementById('btn-save'), m = cur();
  if (!b || !m) return;
  b.textContent = m.dirty ? '💾 保存' : '✓ 保存済み';
  b.classList.toggle('saved', !m.dirty);
}

// ── シート ──
function prevGroupOf(site, exceptName) {
  return allGroups().filter(g => g.site === site.trim() && g.name !== exceptName && (g.total || 0) > 0)[0];
}
function ngName() { return C.groupName(ng.date, ng.site); }
function inheritHTML() {
  const pg = ng.site.trim() && prevGroupOf(ng.site, ng.edited ? ng.name : ngName());
  if (!pg) return '';
  return `<label class="inherit"><input type="checkbox" id="ng-inh" ${ng.inherit ? 'checked' : ''}>
    <span>前回（${slash(pg.date)}点検）の機器 ${pg.total}台を引き継ぐ<small>系統・型式・製造番号・冷媒種・対象外・室内機の型式/製番・報告書の住所/電話番号をコピー。測定値は空で始まります</small></span></label>`;
}
function renderSheet() {
  if (!S.sheet) { $layer.innerHTML = ''; return; }
  if (S.sheet === 'new-g') {
    const sites = [...new Set(allGroups().map(g => g.site).filter(Boolean))];
    $layer.innerHTML = `<div class="sheet-bd" data-act="close"></div><div class="sheet" role="dialog" aria-label="点検グループを作成"><div class="grab"></div><h3>点検グループを作成</h3>
      <label>点検日<input class="ic-fi" type="date" id="ng-date" value="${ng.date}"></label>
      <label>現場名<input class="ic-fi" id="ng-site" list="ng-sites" placeholder="例：横浜ゴム新城工場" value="${esc(ng.site)}" autocomplete="off"><datalist id="ng-sites">${sites.map(s => `<option value="${esc(s)}">`).join('')}</datalist></label>
      <label>点検種類<select class="ic-fi" id="ng-type">${C.INSPECT_TYPES.map(t => `<option${ng.type === t ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
      <div class="preview"><span>グループ名（自動・編集可）</span><input id="ng-name" value="${esc(ng.edited ? ng.name : ngName())}" placeholder="現場名を入れると自動で作られます"></div>
      <div id="ng-inh-slot">${inheritHTML()}</div>
      <button class="ic-btn pri" data-act="ng-create">作成する</button></div>`;
  }
  if (S.sheet === 'addr') {
    const st = addrStat();
    let html;
    if (AD.step === 'confirm') {
      const conf = st.values.filter(x => addrKey(x) !== addrKey(AD));
      const nConf = conf.reduce((a, x) => a + x.count, 0);
      html = `<h3>上書きの確認</h3>
        <div class="note warn"><div><b>${nConf}台</b>に別の住所が入力されています。この住所を上書きしてよろしいですか？</div>
          ${conf.map(x => `<div class="pick" style="background:transparent">${esc(x.addr || '（住所なし）')}<small>TEL ${esc(x.tel || '—')} ・ ${x.count}台</small></div>`).join('')}</div>
        <div class="note"><div>新しい住所</div><div><b>${esc(AD.addr || '（住所なし）')}</b><br>TEL ${esc(AD.tel || '—')}</div></div>
        <div class="btns"><button class="ic-btn pri" data-act="addr-do" data-mode="all">上書きして全台（${st.total}台）に適用</button>
          ${st.empty ? `<button class="ic-btn sub" data-act="addr-do" data-mode="empty">未入力の ${st.empty}台だけに適用</button>` : ''}
          <button class="ic-btn" data-act="addr-back">戻る</button></div>`;
    } else {
      let info = '';
      if (st.values.length === 1 && st.empty) {
        const x = st.values[0];
        info = `<div class="note"><div><b>${x.count}台</b>に入力済みの住所があります。グループ内の全レコード（未入力 ${st.empty}台）にこの住所を適用しますか？</div>
          <div><b>${esc(x.addr || '（住所なし）')}</b><br>TEL ${esc(x.tel || '—')}</div>
          <button class="ic-btn pri" data-act="addr-do" data-mode="fill">この住所を未入力の ${st.empty}台に適用</button></div>`;
      } else if (st.values.length > 1) {
        info = `<div class="note warn"><div>グループ内に<b>${st.values.length}種類</b>の住所が入力されています。どれかを選ぶと下の欄に入ります。</div>
          ${st.values.map((x, i) => `<button class="pick" data-act="addr-pick" data-i="${i}">${esc(x.addr || '（住所なし）')}<small>TEL ${esc(x.tel || '—')} ・ ${x.count}台</small></button>`).join('')}</div>`;
      }
      html = `<h3>報告書の住所・連絡先</h3>${info}
        <label>住所<input class="ic-fi" id="ad-addr" value="${esc(AD.addr)}" placeholder="例：静岡県浜松市西区西山町" autocomplete="off"></label>
        <label>電話番号<input class="ic-fi" id="ad-tel" type="tel" value="${esc(AD.tel)}" placeholder="例：053-000-0000" autocomplete="off"></label>
        <button class="ic-btn pri" data-act="addr-apply">グループ全台（${st.total}台）に適用</button>`;
    }
    $layer.innerHTML = `<div class="sheet-bd" data-act="close"></div><div class="sheet" role="dialog" aria-label="報告書の住所・連絡先"><div class="grab"></div>${html}</div>`;
  }
  if (S.sheet === 'add-m') {
    $layer.innerHTML = `<div class="sheet-bd" data-act="close"></div><div class="sheet" role="dialog" aria-label="機器を追加"><div class="grab"></div><h3>機器を追加</h3>
      <label>系統<input class="ic-fi" id="am-系統" placeholder="例：T-7ミキサー"></label>
      <label>型式<input class="ic-fi" id="am-型式" placeholder="例：RDA-SPE8006HF"></label>
      <label>製造番号<input class="ic-fi" id="am-製造番号"></label>
      <label>冷媒種<select class="ic-fi" id="am-冷媒種"><option value="">選択してください</option>${C.REFS.map(r => `<option>${r}</option>`).join('')}</select></label>
      <button class="ic-btn pri" data-act="am-create">追加して入力へ</button></div>`;
  }
}

// ── オーバーレイ・トースト ──
function overlay(msg) {
  let o = document.getElementById('overlay');
  if (!msg) { if (o) o.remove(); return; }
  if (!o) { o = document.createElement('div'); o.id = 'overlay'; o.className = 'overlay'; document.body.appendChild(o); }
  o.innerHTML = `<div class="spin"></div><div>${esc(msg)}</div>`;
}
let toastTimer;
function toast(msg, type = '') {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast ' + type; t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3000);
}

// =====================================================
// データ操作
// =====================================================
async function loadGroups() {
  S.groups = null; S.gErr = ''; if (S.screen === 'groups') render();
  try { S.groups = (await callGAS('getGroups')).groups || []; }
  catch (e) { S.gErr = e.message; }
  if (S.screen === 'groups') render();
}
async function openGroup(g) {
  S.group = g; S.machines = null; S.mErr = ''; S.filter = 'all'; S.screen = 'group'; render();
  try { S.machines = ((await callGAS('getGroupRecords', { group: g.name })).records || []).map(toMachine); }
  catch (e) { S.mErr = e.message; }
  render();
}
let saving = false;
async function saveCurrent(silent) {
  const m = cur();
  if (!m || !m.dirty) return true;
  if (saving) return false;
  saving = true; overlay('kintone に保存中...');
  try {
    const res = await callGAS('updateRecord', { id: m.id, record: buildPayload(m) }, true);
    S.machines[S.mi] = toMachine(res.record);
    if (!silent) toast('✅ 保存しました', 'success');
    return true;
  } catch (e) {
    toast('❌ 保存できませんでした：' + e.message, 'error');
    return false;
  } finally { saving = false; overlay(''); }
}
async function createGroup() {
  const site = ng.site.trim(), name = (ng.edited ? ng.name : ngName()).trim();
  if (!site) { toast('現場名を入力してください', 'error'); document.getElementById('ng-site').focus(); return; }
  if (!ng.date) { toast('点検日を入力してください', 'error'); return; }
  if (!name) { toast('グループ名を入力してください', 'error'); return; }
  const g = { name, date: ng.date, site, type: ng.type, total: 0, done: 0, pDone: 0, pTotal: 0 };
  const exist = allGroups().find(x => x.name === name);
  if (exist) { S.sheet = null; toast('同じ名前のグループを開きました'); openGroup(exist); return; }

  const pg = prevGroupOf(site, name);
  if (pg && ng.inherit) {
    overlay(`前回の機器 ${pg.total}台を引き継いでいます...`);
    try {
      const src = (await callGAS('getGroupRecords', { group: pg.name })).records || [];
      const recs = src.map(rec => {
        const o = C.fromRecord(rec), n = C.emptyModel();
        ['系統','型式','製造番号','冷媒種'].forEach(c => { n.v[c] = o.v[c]; });
        n.na = new Set(o.na);
        n.indoor = o.indoor.map(r => Object.assign(C.blankRow(), { 型式: r.型式, 製造番号: r.製造番号 }));
        // 報告書の住所・電話番号も前回から引き継ぐ
        const pm = toMachine(rec);
        return Object.assign(C.toRecord(n), groupFields(g), addrRecord(pm.addr, pm.tel));
      });
      for (let i = 0; i < recs.length; i += 100) await callGAS('saveRecords', { records: recs.slice(i, i + 100) }, true);
      overlay(''); S.sheet = null;
      toast(`✅ 作成しました（機器 ${recs.length}台）`, 'success');
      S.localGroups.push(g); openGroup(g);
    } catch (e) { overlay(''); toast('❌ 作成できませんでした：' + e.message, 'error'); }
    return;
  }
  S.sheet = null; S.localGroups.push(g);
  S.group = g; S.machines = []; S.mErr = ''; S.screen = 'group'; render();
  toast('作成しました。「＋ 機器を追加」から登録してください');
}
async function addMachine() {
  const val = c => document.getElementById('am-' + c).value.trim();
  if (!val('系統')) { toast('系統を入力してください', 'error'); document.getElementById('am-系統').focus(); return; }
  const n = C.emptyModel();
  ['系統','型式','製造番号','冷媒種'].forEach(c => { n.v[c] = val(c); });
  overlay('機器を登録中...');
  try {
    const st = addrStat(), a = st.values.length === 1 ? st.values[0] : { addr: '', tel: '' };
    const res = await callGAS('saveRecord', { record: Object.assign(C.toRecord(n), groupFields(S.group), addrRecord(a.addr, a.tel)) }, true);
    S.machines.push(toMachine(res.record));
    S.mi = S.machines.length - 1; S.sheet = null; S.screen = 'input'; render(); updSaveBtn();
    toast('✅ 登録しました', 'success');
  } catch (e) { toast('❌ 登録できませんでした：' + e.message, 'error'); }
  finally { overlay(''); }
}

async function applyAddr(mode) {
  const ms = S.machines || [];
  let addr = AD.addr.trim(), tel = AD.tel.trim();
  if (mode === 'fill') { const v0 = addrStat().values[0]; addr = v0.addr; tel = v0.tel; }
  const key = addrKey({ addr, tel });
  const targets = ms.filter(m => addrKey(m) !== key && (mode === 'all' || !hasAddr(m)));
  if (!targets.length) { S.sheet = null; renderSheet(); toast('変更はありません'); return; }
  overlay(`${targets.length}台に住所を適用中...`);
  try {
    const recs = targets.map(m => ({ id: m.id, record: addrRecord(addr, tel) }));
    for (let i = 0; i < recs.length; i += 100) await callGAS('updateRecords', { records: recs.slice(i, i + 100) }, true);
    targets.forEach(m => { m.addr = addr; m.tel = tel; });
    S.sheet = null; render();
    toast(`✅ ${targets.length}台に適用しました`, 'success');
  } catch (e) { toast('❌ 適用できませんでした：' + e.message, 'error'); }
  finally { overlay(''); }
}
function startApply() {
  AD.addr = AD.addr.trim(); AD.tel = AD.tel.trim();
  if (!AD.addr && !AD.tel) { toast('住所か電話番号を入力してください', 'error'); return; }
  const key = addrKey(AD);
  const conflict = (S.machines || []).some(m => hasAddr(m) && addrKey(m) !== key);
  if (conflict) { AD.step = 'confirm'; renderSheet(); } else applyAddr('all');
}

// =====================================================
// イベント
// =====================================================
C.bindForm($app, () => (S.screen === 'input' ? cur() : null), 'w', m => { m.dirty = true; updSaveBtn(); });

async function onAct(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a.indexOf('iu-') === 0) return;   // 室内機の操作は bindForm 側で処理
  switch (a) {
    case 'reload':  loadGroups(); break;
    case 'reload-g': openGroup(S.group); break;
    case 'open-g':  { const g = allGroups().find(x => x.name === b.dataset.g); if (g) openGroup(g); break; }
    case 'open-m':  S.mi = +b.dataset.i; S.screen = 'input'; render(); updSaveBtn(); $app.querySelector('.ic-scroll').scrollTop = 0; break;
    case 'flt':     S.filter = b.dataset.v; render(); break;
    case 'back':
      if (S.screen === 'input') { if (!(await saveCurrent(true))) return; S.screen = 'group'; render(); }
      else { S.screen = 'groups'; render(); loadGroups(); }
      break;
    case 'prev': case 'next': {
      if (!(await saveCurrent(true))) return;
      S.mi += a === 'next' ? 1 : -1; render(); updSaveBtn();
      toast(`${cur().v.系統 || '次の機器'} を表示中`);
      break;
    }
    case 'save':    if (await saveCurrent(false)) { render(); updSaveBtn(); } break;
    case 'new-g':   Object.assign(ng, { date: today(), site: '', type: C.INSPECT_TYPES[0], name: '', edited: false, inherit: true }); S.sheet = 'new-g'; renderSheet(); break;
    case 'add-m':   S.sheet = 'add-m'; renderSheet(); break;
    case 'addr':    { const v0 = addrStat().values[0] || { addr: '', tel: '' }; Object.assign(AD, { addr: v0.addr, tel: v0.tel, step: 'edit' }); S.sheet = 'addr'; renderSheet(); break; }
    case 'addr-pick': { const x = addrStat().values[+b.dataset.i]; AD.addr = x.addr; AD.tel = x.tel; renderSheet(); break; }
    case 'addr-apply': startApply(); break;
    case 'addr-back': AD.step = 'edit'; renderSheet(); break;
    case 'addr-do':   applyAddr(b.dataset.mode); break;
    case 'close':   S.sheet = null; renderSheet(); break;
    case 'ng-create': createGroup(); break;
    case 'am-create': addMachine(); break;
  }
}
$app.addEventListener('click', onAct);
$layer.addEventListener('click', onAct);

$app.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value;
  const list = $app.querySelector('.list'), tmp = document.createElement('div');
  tmp.innerHTML = groupsHTML();
  list.innerHTML = tmp.querySelector('.list').innerHTML;
});
$layer.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ad-addr') { AD.addr = t.value; return; }
  if (t.id === 'ad-tel')  { AD.tel = t.value; return; }
  if (t.id === 'ng-date') ng.date = t.value;
  if (t.id === 'ng-site') ng.site = t.value;
  if (t.id === 'ng-type') ng.type = t.value;
  if (t.id === 'ng-name') { ng.name = t.value; ng.edited = !!t.value.trim(); }
  if (t.id === 'ng-inh')  { ng.inherit = t.checked; return; }
  if ((t.id === 'ng-date' || t.id === 'ng-site') && !ng.edited) { const n = document.getElementById('ng-name'); if (n) n.value = ngName(); }
  if (t.id === 'ng-site' || t.id === 'ng-date' || t.id === 'ng-name') { const s = document.getElementById('ng-inh-slot'); if (s) s.innerHTML = inheritHTML(); }
});
window.addEventListener('beforeunload', e => { const m = cur(); if (S.screen === 'input' && m && m.dirty) { e.preventDefault(); e.returnValue = ''; } });

// =====================================================
// 初期化
// =====================================================
render();
loadGroups();
callGAS('getDiagRules')
  .then(d => { C.rules = d.rules || []; })
  .catch(() => { C.rules = []; })
  .finally(() => { const m = cur(); if (m && S.screen === 'input') C.refresh($app, m, 'w'); });
</script>
</body>
</html>
